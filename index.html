<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cờ Tướng Online</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Cờ Tướng</h1>
<main class="col">
  <div class="seg big" data-for="mode">
    <button data-v="pve">🤖 Chơi với máy</button><button data-v="pvp">👥 2 người, 1 máy</button><button data-v="online">🌐 Chơi online</button>
  </div>
  <select id="mode" style="display:none"><option value="pve">Chơi với máy</option><option value="pvp">2 người (cùng thiết bị)</option><option value="online">Online 2 máy</option></select>

  <div class="card opts">
    <div id="hint"></div>
    <div id="pveOpts" class="row">
      <div class="grp"><span class="lb">Bạn cầm</span>
        <div class="seg" data-for="side"><button data-v="r">Đỏ (đi trước)</button><button data-v="b">Đen</button></div>
        <select id="side" style="display:none"><option value="r">Đỏ</option><option value="b">Đen</option></select></div>
      <div class="grp"><span class="lb">Độ khó</span>
        <div class="seg" data-for="lvl"><button data-v="1">Dễ</button><button data-v="2">Vừa</button><button data-v="3">Khó</button></div>
        <select id="lvl" style="display:none"><option value="1">Dễ</option><option value="2" selected>Vừa</option><option value="3">Khó</option></select></div>
    </div>
    <div class="row"><div class="grp"><span class="lb">Kiểu quân</span>
      <div class="seg" data-for="skin"><button data-v="han">帥 Chữ Hán</button><button data-v="vi">Chữ Việt</button><button data-v="ico">♞ Biểu tượng</button></div>
      <select id="skin" style="display:none"><option value="han">han</option><option value="vi">vi</option><option value="ico">ico</option></select></div></div>
    <div id="onlineOpts" style="display:none">
      <button id="mk">Tạo phòng (bạn cầm Đỏ)</button>
      <input class="inp" id="roomLink" readonly style="display:none">
      <button class="g" id="cp" style="display:none">Sao chép link mời</button>
      <label>Hoặc nhập mã phòng để vào (bạn cầm Đen)</label>
      <input class="inp" id="code" placeholder="Mã phòng">
      <button class="g" id="jn">Vào phòng</button>
    </div>
    <div id="net" class="note"></div>
  </div>

  <div id="status" class="status"></div>

  <div id="board">
    <svg viewBox="0 0 9 10" preserveAspectRatio="none" id="lines"></svg>
    <div id="toast"></div>
  </div>

  <div class="card btns">
    <button id="new">Ván mới</button>
    <button class="g" id="undo">Đi lại nước trước</button>
    <button class="g" id="flip">Xoay bàn cờ</button>
  </div>

  <div class="card"><div class="lb2">Các nước đã đi</div><div id="log"></div></div>
  <p class="foot">Bên hết nước đi (chiếu bí hoặc bí nước) là bên thua. Chưa áp dụng luật cấm lặp nước/chiếu dai.</p>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/rules.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/online.js"></script>
<script src="js/main.js"></script>
<script>
/* Báo lỗi dễ hiểu nếu thiếu thư mục js/ khi upload */
if(typeof newGame==='undefined'){
  document.getElementById('status').innerHTML='⚠️ Không tải được các file trong thư mục <b>js/</b>. Hãy upload đủ thư mục <b>js</b> (rules.js, ai.js, ui.js, online.js, main.js) cùng cấp với index.html, đúng chữ thường.';
  document.getElementById('status').style.color='#ffb4a8';
}
</script>
</body>
</html>
